[package]
name = "winsysm"
version = "1.0.0"
edition = "2021"
description = "Windows System Manager — Scan, Monitor, Clean, Protect"
authors = ["Isaiah Clifford Opoku"]
license = "MIT"

[dependencies]
sysinfo = "0.30"
walkdir = "2.4"
ratatui = "0.26"
crossterm = "0.27"
colored = "2.0"
humansize = "2.1"
chrono = "0.4"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
glob = "0.3"
indicatif = { version = "0.17", features = ["rayon"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "winsysm"
path = "src/main.rs"
